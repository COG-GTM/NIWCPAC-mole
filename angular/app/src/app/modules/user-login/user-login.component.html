<div class="center-form">
  <mat-card-title class="card-dark">
    <img [src]="gearURL" alt class="icon">
    <div class="login-title">Mole: Test Analysis Tool</div>
  </mat-card-title>
  <mat-card appearance="outlined" class="card-light">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      @if (!_authService.userValue) {
        <mat-card-content>
          <p><mat-form-field><mat-label>Username</mat-label>
          <input type="text" matInput formControlName="username" autofocus>
        </mat-form-field></p>
        <p><mat-form-field><mat-label>Password</mat-label>
        <input type="password" matInput formControlName="password">
      </mat-form-field></p>
      <button class="user" mat-raised-button color="primary">
        <span class="material-icons">login</span>
      </button>
    </mat-card-content>
  }
  @if (_authService.userValue) {
    <div id="outer-form-div" class="row">
      <div id="inner-form-div" class="col-sm-12">You are logged in as {{ _authService.userValue.username }}. <br />
        <!-- Token Expires: {{ _authService.userValue.token_expires }}<br /> -->
        <!-- <button (click)="refreshToken()" class="btn btn-primary">Refresh Token</button>&nbsp; -->
        <button mat-raised-button color="primary" id="logout-button" class="user" (click)="logout()">
          Logout
        </button>
      </div>
    </div>
  }
</form>
</mat-card>
</div>
