
@if (selectedTrial) {
  <div class="container" id="div-selected-trial" fxLayout="row">
    @if (trialVisibility) {
      <mat-card-header id="mat-card-header-selected-trial">
        <mat-card-title class="selector">
          <form [formGroup]="form">
            <mat-form-field floatLabel="never" >
              <mat-label id="mat-label-selected-trial-name"> {{selectedTrial.name}} </mat-label>
              <mat-select id="mat-select-trials" formControlName="trials" panelClass="panel-light" (selectionChange)="onChangeTrial($event)">
                @for (trial of allTrialsObservable | async; track trial) {
                  <mat-option id="mat-option-trial" [value]="trial">
                    {{trial.name}}
                  </mat-option>
                }
              </mat-select>
            </mat-form-field>
          </form>
        </mat-card-title>
        <span style="margin-top: 24px">
          <mat-chip-set>
            @if (allowEdit) {
              <mat-chip id="mat-chip-edit" color="warn" class="edit card-light-dark mat-elevation-z6" (click)="openTrialCreator()">
                <mat-icon>edit</mat-icon>
              </mat-chip>
            }
            @if (allowEdit) {
              <mat-chip id="mat-chip-add" class="add card-light-dark mat-elevation-z6" [matMenuTriggerFor]="menu">
                <mat-icon>add</mat-icon>
              </mat-chip>
            }
            <mat-menu #menu="matMenu">
              <button mat-menu-item id="button-day" (click)="newMajor()">{{selectedCampaign ? selectedCampaign.trialIdMajorName : "Major"}}</button>
              <button id="button-shift" mat-menu-item (click)="newMinor()">{{selectedCampaign ? selectedCampaign.trialIdMinorName : "Minor"}}</button>
              <button id="button-run" mat-menu-item (click)="newMicro()">{{selectedCampaign ? selectedCampaign.trialIdMicroName : "Micro"}}</button>
            </mat-menu>
            @if (selectedTrial.current) {
              <mat-chip id="mat-chip-current" color="accent" highlighted>Current</mat-chip>
            }
            @if (selectedTrial.reported) {
              <mat-chip id="mat-chip-reported" color="accent" highlighted>Reported</mat-chip>
            }
          </mat-chip-set>
        </span>
      </mat-card-header>
    }
  </div>
}
