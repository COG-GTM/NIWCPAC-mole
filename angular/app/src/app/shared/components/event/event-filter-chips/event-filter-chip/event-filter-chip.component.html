<mat-chip #chip [removable]="true" (removed)="removeChip()" class="mat-elevation-z4">
  @if (prefix) {
    <span id="span-prefix">{{prefix}}:&nbsp;</span>
  }
  @if (icon) {
    <fa-icon [icon]="icon"></fa-icon>
    }@if (icon) {
    <span id="span-icon">&nbsp;</span>
  }
  {{ title }}
  <mat-icon matChipRemove>cancel</mat-icon>
</mat-chip>
