@if (title) {
  <h2>Notes</h2>
}

<mat-form-field class="note-input" appearance="fill">
  <mat-label>Note</mat-label>
  <textarea matInput #newNote
  [(ngModel)]='newNoteValue'></textarea>
</mat-form-field>
&nbsp;
<div class="notes-container">
  @for (note of dialogNotes | reverse; track note; let noteIndex = $index) {
    <mat-card appearance="outlined" class="card-light">
      <span class="top-right-corner">
        @if (!note.editing) {
          <button id="mat-icon-button-2" mat-icon-button
            (click)="toggleEdit(note.id, true)">
            @if (!note.editing) {
              <mat-icon>edit</mat-icon>
            }
            @if (note.editing) {
              <mat-icon>close</mat-icon>
            }
          </button>
        }
        @if (note.editing) {
          <button id="mat-icon-button-3" mat-icon-button
            (click)="toggleEdit(note.id, false)">
            <mat-icon>close</mat-icon>
          </button>
        }
        @if (!note.editing) {
          <button id="mat-icon-button-4" mat-icon-button
            (click)="deleteNote(note)">
            <mat-icon>delete</mat-icon>
          </button>
        }
      </span>
      <mat-card-subtitle>{{note.tester.name}}</mat-card-subtitle>
      @if (!note.editing) {
        <mat-card-content id="mat-card-content-note">
          {{note.note}}
        </mat-card-content>
      }
      @if (note.editing) {
        <mat-card-content>
          <mat-form-field appearance="fill">
            <mat-label>Note</mat-label>
            <textarea matInput #editNote
            [value]='note.note'></textarea>
          </mat-form-field>
          &nbsp;
          <button id="mat-flat-button-1" mat-flat-button
            (click)="updateNote(note, editNote.value)"
            [disabled]="editNote.value.length == 0"
            color="primary">
            Update Note
          </button>
        </mat-card-content>
      }
    </mat-card>
  }

</div>

@if (displayButtons) {
  <div mat-dialog-actions>
    <button mat-flat-button id="button1-dialog-action"  color="accent" mat-dialog-close>Cancel</button>
    <button mat-flat-button id="button2-dialog-action" mat-dialog-close (click)="attachNote()" color="primary">Ok</button>
  </div>
}
